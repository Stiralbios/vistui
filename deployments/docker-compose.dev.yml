# docker compose -f deployments/docker-compose.dev.yml up -d
services:
  # Web UI to browse the databases: http://localhost:8081
  # Login: system "PostgreSQL", server "vistui_postgres" (dev) or "vistui_postgres_test",
  # username/password/database "vistui". Vector columns render as text arrays.
  vistui_adminer:
    image: adminer:4.8.1
    container_name: vistui_adminer
    restart: on-failure
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: vistui_postgres
    depends_on:
      - vistui_postgres
      - vistui_postgres_test

  vistui_postgres:
    image: paradedb/paradedb:pg18
    container_name: vistui_postgres
    restart: on-failure
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: vistui
      POSTGRES_PASSWORD: vistui
      POSTGRES_DB: vistui
    volumes:
      - vistui_postgres_data:/var/lib/postgresql
    healthcheck:
      # TCP probe on purpose: the default socket probe passes against the temporary
      # server the entrypoint runs for initdb, so fresh volumes could look healthy
      # before the real server accepts connections.
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U vistui -d vistui"]
      interval: 5s
      timeout: 5s
      retries: 10

  vistui_postgres_test:
    image: paradedb/paradedb:pg18
    container_name: vistui_postgres_test
    restart: on-failure
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: vistui
      POSTGRES_PASSWORD: vistui
      POSTGRES_DB: vistui
    volumes:
      - vistui_postgres_test_data:/var/lib/postgresql
    healthcheck:
      # TCP probe on purpose: the default socket probe passes against the temporary
      # server the entrypoint runs for initdb, so fresh volumes could look healthy
      # before the real server accepts connections.
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U vistui -d vistui"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vistui_postgres_data:
  vistui_postgres_test_data:
