providers:
  local-ollama:
    base_url: "http://192.168.9.137:11434/v1"
    api_key_env: "OLLAMA_API_KEY"
    # Only decision (System One) calls use this provider now, and they are slow:
    # d3:4b takes ~5-10s per scored element (one decide call per message/object),
    # and 300s also covers the cold model load on the first call of a burst.
    timeout_seconds: 300
  # gomodel is an OpenAI-compatible proxy in front of several ollama upstreams:
  #   - "ollama_yople/*": our own ollama box (same host as local-ollama, reached via the proxy)
  #   - "strata_toaster/*": the toaster PC on another network, not reachable directly
  # Requires GOMODEL_TOKEN in the environment.
  gomodel:
    base_url: "https://gomodel.eagal.org/v1"
    api_key_env: "GOMODEL_TOKEN"
    timeout_seconds: 120

defaults:
  embedding:
    provider: "gomodel"
    model: "ollama_yople/embeddinggemma-2:740m"
    dimensions: 768
  llm:
    provider: "gomodel"
    model: "strata_toaster/iq3_xxs"
    temperature: 0.0
    max_tokens: 4096
  # Decision models answer typed questions on ollama's System One endpoint
  # (/v1/systemone); they reject chat completions. gomodel does not forward that
  # endpoint to ollama upstreams, so the decision model goes direct.
  decision:
    provider: "local-ollama"
    model: "d3:4b"

# Per-task overrides: the explicit tuning surface for individual pipeline tasks, for
# chat tasks and decision tasks alike (decide(task=...) resolves here too). The chat
# entries currently duplicate defaults.llm; 4.5 will split them (decision vs generation).
overrides:
  # Decision task (System One /v1/systemone), not a chat task: must point at a
  # directly reachable ollama provider — gomodel cannot forward /v1/systemone.
  salience:
    provider: "local-ollama"
    model: "d3:4b"
  memory_ratio:
    provider: "gomodel"
    model: "strata_toaster/iq3_xxs"
  event:
    provider: "gomodel"
    model: "strata_toaster/iq3_xxs"
  topic_candidate:
    provider: "gomodel"
    model: "strata_toaster/iq3_xxs"
  topic_update:
    provider: "gomodel"
    model: "strata_toaster/iq3_xxs"
  fact_candidate:
    provider: "gomodel"
    model: "strata_toaster/iq3_xxs"
  fact_update:
    provider: "gomodel"
    model: "strata_toaster/iq3_xxs"
