providers:
  local-ollama:
    base_url: "http://192.168.9.137:11434/v1"
    api_key_env: "OLLAMA_API_KEY"
    timeout_seconds: 120

defaults:
  embedding:
    provider: "local-ollama"
    model: "qwen3-embedding:8b"
    dimensions: 768
  llm:
    provider: "local-ollama"
    model: "gemma4:e4b"
    temperature: 0
    max_tokens: 2048

overrides:
  salience:
    provider: "local-ollama"
    model: "gemma4:e4b"
    temperature: 0.0
  keywords:
    provider: "local-ollama"
    model: "gemma4:e4b"
    temperature: 0.1
  memory_ratio:
    provider: "local-ollama"
    model: "gemma4:e4b"
    temperature: 0.1
  event:
    provider: "local-ollama"
    model: "gemma4:e4b"
    temperature: 0.2
  topic_candidate:
    provider: "local-ollama"
    model: "gemma4:e4b"
    temperature: 0.2
  topic_update:
    provider: "local-ollama"
    model: "gemma4:e4b"
    temperature: 0.2
  fact_candidate:
    provider: "local-ollama"
    model: "gemma4:e4b"
    temperature: 0.2
  fact_update:
    provider: "local-ollama"
    model: "gemma4:e4b"
    temperature: 0.2
